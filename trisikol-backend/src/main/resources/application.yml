spring:
  application:
    name: trisikol-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trisikol}
    username: ${DB_USERNAME:trisikol}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
trisikol:
  routing:
    base-url: ${ROUTING_BASE_URL:https://router.project-osrm.org}
  dispatch:
    require-location: ${DISPATCH_REQUIRE_LOCATION:true}
